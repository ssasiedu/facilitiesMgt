# Supabase CLI configuration for FacilitiesManagement.
# `supabase link --project-ref <ref>` then `supabase db push` applies supabase/migrations in order.
project_id = "facilities-management"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
# `enable_signup` was renamed; `[auth] enable_signup` above still governs sign-ups.
enabled = true
enable_confirmations = true

# Public endpoints check their own credentials (cron secret, webhook signature, document token)
[functions.send-notification]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false

[functions.public-document]
verify_jwt = false

[functions.public-survey]
verify_jwt = false

[functions.invite-user]
verify_jwt = true
