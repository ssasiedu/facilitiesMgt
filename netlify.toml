[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA rewrite: every route serves index.html
# A hashed asset that no longer exists must answer 404. Without this it falls through to
# the single-page rule below and the browser receives index.html under a .js URL, which it
# cannot parse as a module. Netlify serves files that do exist before any redirect, so this
# only ever applies to missing ones.
[[redirects]]
  from = "/assets/*"
  to = "/offline.html"
  status = 404

# Single-page app: every other path is handled by the router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
